
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASPUR STORE</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:25px 15px;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#071a33,#1264a3,#9cddff);
  color:#fff;text-align:center;
}
.container{max-width:500px;margin:auto}
h1{font-size:32px;margin-bottom:8px}
.subtitle{color:#d7efff;margin-bottom:28px}
.product{
  background:#fff;color:#102b49;
  border:2px solid #8bd4ff;border-radius:18px;
  padding:20px;margin:15px 0;
  box-shadow:0 6px 15px #0005;
}
.product h2{margin:0 0 10px;font-size:20px}
.price{font-size:19px;font-weight:bold;color:#0878c9;margin:12px}
button{
  width:100%;padding:13px;border:0;border-radius:10px;
  background:#0878c9;color:white;font-size:16px;
  font-weight:bold;cursor:pointer;
}
button:active{background:#064d85}
.footer{margin-top:28px;font-size:12px;color:#d7efff}
</style>
</head>
<body>
<div class="container">
  <h1>MASPUR STORE</h1>
  <p class="subtitle">Murah • Cepat • Terpercaya</p>

  <div class="product">
    <h2>NOKOS ASIA</h2>
    <p>Nomor Kosong Asia</p>
    <div class="price">Rp5.000 / Rp10.000</div>
    <button onclick="pesan('NOKOS ASIA','Rp5.000 / Rp10.000')">PESAN SEKARANG</button>
  </div>

  <div class="product">
    <h2>NOKOS EROPA</h2>
    <p>Nomor Kosong Eropa</p>
    <div class="price">Rp10.000</div>
    <button onclick="pesan('NOKOS EROPA','Rp10.000')">PESAN SEKARANG</button>
  </div>

  <div class="product">
    <h2>ALIGHT MOTION</h2>
    <p>Langganan 1 Tahun</p>
    <div class="price">Rp3.000</div>
    <button onclick="pesan('ALIGHT MOTION 1 TAHUN','Rp3.000')">PESAN SEKARANG</button>
  </div>

  <div class="product">
    <h2>CANVA</h2>
    <p>Akses Canva</p>
    <div class="price">Rp3.000</div>
    <button onclick="pesan('CANVA','Rp3.000')">PESAN SEKARANG</button>
  </div>

  <p class="footer">© MASPUR STORE</p>
</div>

<script>
function pesan(produk,harga){
  const nomor='6285846119341';
  const teks='Halo MASPUR STORE, saya mau pesan '+produk+
  ' dengan harga '+harga+'. Apakah masih tersedia?';
  window.open('https://wa.me/'+nomor+'?text='+encodeURIComponent(teks),'_blank');
}
</script>
</body>
</html>
